<!DOCTYPE html>
<html lang="en" 
th:replace= "~{base::parent(~{::#content}, ~{::title}, ~{::script})}">
<head>
    <title>Contact Us Page</title>
</head>
<body>

<div id="content">
    <!-- Contact Us Section -->
    <section class="bg-white py-20">
        <div class="container mx-auto max-w-4xl">
            <div class="text-center mb-12">
                <h1 class="text-4xl font-bold mb-4 text-gray-900">Contact US</h1>
                <p class="text-lg text-gray-600">Have questions? We'd love to hear from you. Send us a message and we'll respond as soon as possible.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
                <!-- Contact Info -->
                <div class="space-y-6">
                    <div class="flex items-start">
                        <i class="fas fa-envelope text-blue-600 text-2xl mt-1 mr-4"></i>
                        <div>
                            <h3 class="font-semibold text-lg text-gray-900">Email</h3>
                            <p class="text-gray-600">support@contacthub.com</p>
                        </div>
                    </div>
                    <div class="flex items-start">
                        <i class="fas fa-phone text-blue-600 text-2xl mt-1 mr-4"></i>
                        <div>
                            <h3 class="font-semibold text-lg text-gray-900">Phone</h3>
                            <p class="text-gray-600">+91 (555) 123-4567</p>
                        </div>
                    </div>
                    <div class="flex items-start">
                        <i class="fas fa-map-marker-alt text-blue-600 text-2xl mt-1 mr-4"></i>
                        <div>
                            <h3 class="font-semibold text-lg text-gray-900">Address</h3>
                            <p class="text-gray-600">Alambagh<br>Lucknow, UP, India 226025</p>
                        </div>
                    </div>
                </div>

                <!-- Contact Form -->
                <div class="bg-gray-50 p-8 rounded-lg shadow">
                    <div id="successMessage" class="hidden mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg">
                        <i class="fas fa-check-circle mr-2"></i>Message sent successfully!
                    </div>
                    <form id="contactForm">
                        <div class="mb-4">
                            <label class="block text-gray-700 font-medium mb-2">Name</label>
                            <input type="text" class="w-full px-4 py-2 border border-gray-300 bg-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Your Name" required>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 font-medium mb-2">Email</label>
                            <input type="email" class="w-full px-4 py-2 border border-gray-300 bg-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="your@email.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 font-medium mb-2">Message</label>
                            <textarea rows="4" class="w-full px-4 py-2 border border-gray-300 bg-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Your message..." required></textarea>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition duration-300">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Section -->
    <footer class="bg-gray-800 text-white py-8">
        <div class="container mx-auto text-center">
            <p>&copy; 2026 <a th:href="@{'/home'}" class="hover:underline">ContactHub™</a>. All rights reserved.</p>
        </div>
    </footer>
</div>
<script>
    console.log("Contact page script");
    
    document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const successMsg = document.getElementById('successMessage');
        successMsg.classList.remove('hidden');
        this.reset();
        setTimeout(() => successMsg.classList.add('hidden'), 5000);
    });
</script>
</body>
</html>
