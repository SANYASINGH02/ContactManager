<div
  data-th-if="${session.message}"
  data-th-object="${session.message}"
  data-th-fragment="messagebox"
  th:classappend="*{'text-' +type+ '-900 border border-' +type+ '-300 rounded-lg bg-' +type+ '-50 dark:bg-gray-800 dark:text-' +type+ '-400 dark:border-' +type+ '-800'}"
  class="flex items-center p-4 mb-4 text-sm"
  role="alert"
>
  <svg
    class="shrink-0 inline w-4 h-4 me-3"
    aria-hidden="true"
    xmlns="http://www.w3.org/2000/svg"
    fill="currentColor"
    viewBox="0 0 20 20"
  >
    <path
      d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"
    />
  </svg>
  <span class="sr-only">Info</span>

  <div>
    <!-- we can access object's('message' here) property( 'content' here) directly with * -->
    <span data-th-utext="*{content}"></span>
  </div>

  <!-- remove the message from session otherwise this message box (of Registration successful) will still be showing even after signUp and refresh page 
   because on signUp, session contains the message and remain there until removed so this message.html will be still be applicable, that's why it's 
   necessary to remove the message from session -->
  <th:block th:text="${@sessionHelper.removeMessage()}"></th:block>
</div>
