spring.application.name=Contact Manager
server.port=8081

# ******** mySql database configurations ********
# data source url, localhost : server ip address where db is running, here it is running on our machine so localhost,
# protocol : jdbc, db : sql, 3306 : db port no. (can be change when db will run server), scm20 : db name inside db, 
spring.datasource.url=jdbc:mysql://localhost:3306/cm_002
spring.datasource.username=root
spring.datasource.password=sanya002

# ******** JPA configurations ************
# to see query on console
spring.jpa.show-sql=true
# for creating schemas and tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
# dialect tells JPA that for which db(mysql or postgres) it have to make query
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ******** E-mail configurations ************



# ******** Security configurations ************

 spring.security.user.name=sanya
 spring.security.user.password=sanya

# File upload configurations
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Disable DevTools restart to avoid cache issues
spring.devtools.restart.enabled=false

# Disable Thymeleaf cache
spring.thymeleaf.cache=false

# Disable HTTP caching for development
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
